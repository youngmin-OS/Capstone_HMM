spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deepfake}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:deepfake}
    password: ${SPRING_DATASOURCE_PASSWORD:deepfake}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

# FastAPI AI 서버 주소
# 로컬: 환경변수 없으면 localhost:8000 기본값 사용
# RunPod 배포 시: AI_SERVER_URL=https://{pod-id}-8000.proxy.runpod.net 환경변수 설정
ai:
  analyze:
    url: ${ANALYZE_URL:http://localhost:8000}
  protect:
    url: ${PROTECT_URL:https://kmlvwtyfyf55b9-8000.proxy.runpod.net}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

jwt:
  secret: ${JWT_SECRET:dev-only-change-this-secret-key-32b}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
